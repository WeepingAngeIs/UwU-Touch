name: Windows download
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller
      - name: Test timer and controls
        run: python -m pytest tests -q
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --name NovaMacroHub --icon assets/icon.ico --add-data "assets;assets" --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --collect-submodules keyring.backends run.py
      - name: Check packaged app starts
        shell: pwsh
        run: |
          $env:NOVAMACRO_DATA = Join-Path $env:RUNNER_TEMP 'nova-smoke'
          $app = Start-Process -FilePath 'dist/NovaMacroHub/NovaMacroHub.exe' -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Packaged app exited during startup' }
          Stop-Process -Id $app.Id
          $log = Join-Path $env:NOVAMACRO_DATA 'app.log'
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Traceback|ERROR')) { throw 'Packaged app reported a startup error' }
      - name: Package download
        shell: pwsh
        run: |
          Copy-Item README.txt dist/NovaMacroHub/README.txt
          Compress-Archive -Path dist/NovaMacroHub -DestinationPath NovaMacroHub-Windows.zip
          (Get-FileHash NovaMacroHub-Windows.zip -Algorithm SHA256).Hash + '  NovaMacroHub-Windows.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NovaMacroHub-Windows
          path: |
            NovaMacroHub-Windows.zip
            SHA256SUMS.txt
      - name: Publish download
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" NovaMacroHub-Windows.zip SHA256SUMS.txt --title "Nova Macro Hub — ticking timer and mini controller" --notes "Extract the ZIP and run NovaMacroHub.exe inside the extracted folder. Keep the whole folder together. Exit any older running copy first. Enable Mini controller during playback to open the mini version automatically, or use the Mini button. Built and tested on GitHub Windows runners."
